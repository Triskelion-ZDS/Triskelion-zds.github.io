<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tau Gamma Phi – Zamboanga del Sur</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0b; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
          font-family: system-ui, sans-serif; color: #eee; }
  #wait a { color: #f2c14e; }
</style>
</head>
<body>
<div id="wait"><p>Opening the website…<br><a id="go" href="https://year-keywords-reduction-characterized.trycloudflare.com">Tap here if it does not open.</a></p></div>
<script>
  // The website runs on the council's own computer behind an address that changes now and then. This page shows it
  // inside itself so visitors keep this permanent address in the address bar; the page they are on is mirrored here
  // (e.g. /officers, /portal/members), sign-in and the portal included.
  var SITE = "https://year-keywords-reduction-characterized.trycloudflare.com";
  var origin = new URL(SITE).origin;
  var path = location.pathname + location.search + location.hash;
  document.getElementById("go").href = SITE + path;
  {
    var f = document.createElement("iframe");
    f.src = SITE + path;
    f.title = "Tau Gamma Phi – Zamboanga del Sur";
    f.allow = "fullscreen";
    f.onload = function () { document.getElementById("wait").style.display = "none"; };
    document.body.appendChild(f);
    window.addEventListener("message", function (e) {
      if (e.origin !== origin || !e.data || e.data.type !== "tc-nav") return;
      if (typeof e.data.path === "string" && e.data.path.charAt(0) === "/") history.replaceState(null, "", e.data.path);
      if (typeof e.data.title === "string" && e.data.title) document.title = e.data.title;
    });
  }
</script>
</body>
</html>
